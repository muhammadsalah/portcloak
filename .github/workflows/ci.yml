# CI guards main, and nothing else automatically.
#
# It used to run on every push to every branch, which is a defensible policy
# for a repository with one contributor and a cheap suite — but it spends
# minutes on work-in-progress that is going to be rewritten before it lands.
# The branch that has to stay green is the one releases are cut from.
#
# Integration tests are tagged rather than skipped by a runtime probe, so a
# missing service container produces "not run" rather than a silent pass. A
# green board that quietly skipped every backend test is worse than a red one.
name: CI

on:
  push:
    branches: [main]
  # A pull request into main is main's problem before it is merged, not after.
  # Without this, a branch could be merged having never been built.
  pull_request:
    branches: [main]
  # The way to run the suite against a branch that is not main: Actions → CI →
  # Run workflow. Restricting the automatic triggers should not remove the
  # ability to ask, only the obligation to run unasked.
  workflow_dispatch:

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "22"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # TAGS is empty everywhere but Linux, where `gtk3` selects Wails'
        # GTK3 + webkit2gtk-4.1 backend. Wails defaults to GTK4 +
        # webkitgtk-6.0, which is not the stack installed below and is not
        # present on Debian 12 or Ubuntu 22.04 — so without this tag the
        # Linux build fails on a missing webkitgtk-6.0 pkg-config file.
        # Must stay in step with build/linux/Dockerfile.
        include:
          - os: ubuntu-latest
            tags: gtk3
            prod_tags: production,gtk3
          - os: macos-latest
            tags: ""
            prod_tags: production
          - os: windows-latest
            tags: ""
            prod_tags: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build the frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Build
        run: go build -tags "${{ matrix.tags }}" ./...

      - name: Build the application
        run: go build -tags "${{ matrix.tags }}" -o portcloak ./cmd/portcloak

      # The release build is a different compilation, not the same one with a
      # flag: `production` selects different files in both Wails and this
      # repository. Building it here is what stops that path rotting unnoticed
      # between releases and only failing on the day someone cuts a tag.
      - name: Build the application (production)
        run: go build -tags "${{ matrix.prod_tags }}" -trimpath -ldflags "-s -w" -o portcloak-production ./cmd/portcloak

  vet:
    name: Vet & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # internal/app imports Wails, which is cgo over GTK on Linux, so these
      # need the same headers and the same tag as the build job.
      - name: Linux WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go vet -tags gtk3 ./internal/... ./frontend/...
      # v6 installs a golangci-lint v1 binary built with go1.24, which refuses
      # to load a module whose go directive is newer than its own toolchain:
      #
      #   can't load config: the Go language version (go1.24) used to build
      #   golangci-lint is lower than the targeted Go version (1.27)
      #
      # The action's major version and the linter's are coupled — v8 is the one
      # that installs golangci-lint v2 — and the linter is pinned rather than
      # floating so a new release cannot fail the build on a lint rule nobody
      # here has run yet.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.1
          args: --timeout=5m --build-tags=gtk3 ./internal/...

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Linux WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      # No network, no Docker, no Keycloak. If a test in the engine needs one of
      # those, a fake is missing rather than the test being justified.
      - run: go test -tags gtk3 ./internal/... -race -timeout 15m

  redaction:
    # A separate stage so a redaction failure is unmissable. Test output and
    # crash logs are exactly where a real bind password would first escape.
    name: Redaction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test ./internal/engine/obs -run 'TestRedaction|TestAuditLog_IsRedacted' -v
      # check-traceability.sh runs `go test -list` over ./internal/..., which
      # compiles every package to answer — including internal/app, which
      # imports Wails and is cgo over GTK on Linux. Without these the listing
      # fails to build and the check cannot tell a renamed test from a missing
      # compiler. Same headers as the build and vet jobs.
      - name: Linux WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: The traceability matrix cites tests that exist
        run: ./build/ci/check-traceability.sh
      - name: No secret material in committed fixtures or config templates
        run: |
          ! grep -rIn --include='*.yaml' --include='*.yml' \
            -E 'AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY' . \
            || (echo "committed secret material" && exit 1)

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run check
      - run: npm --prefix frontend run build

  integration:
    name: Integration
    runs-on: ubuntu-latest
    # Service containers cost minutes, so this is the one job that does not run
    # everywhere the others do.
    #
    # Since the automatic triggers were narrowed to main, the `phase/` arm is
    # reachable only through Run workflow on such a branch — which is the point
    # of keeping it. Note that a pull request's ref is refs/pull/N/merge, so
    # integration does not run on PRs; the other five jobs do.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/phase/')
    services:
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: portcloak
          MINIO_ROOT_PASSWORD: portcloak-test-secret
          MINIO_DEFAULT_BUCKETS: portcloak-test
        ports: ["9000:9000"]
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports: ["10000:10000"]
      sshd:
        image: lscr.io/linuxserver/openssh-server:latest
        env:
          PASSWORD_ACCESS: "true"
          USER_NAME: portcloak
          USER_PASSWORD: portcloak-test-secret
          SUDO_ACCESS: "false"
        ports: ["2222:2222"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Storage backends
        env:
          PORTCLOAK_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          PORTCLOAK_TEST_S3_BUCKET: portcloak-test
          PORTCLOAK_TEST_S3_CREDENTIAL: portcloak:portcloak-test-secret
          PORTCLOAK_TEST_AZURE_CONNECTION: >-
            DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;
          PORTCLOAK_TEST_AZURE_CONTAINER: portcloak-test
        run: go test -tags=integration ./internal/engine/store/... -run 'TestS3|TestAzure' -timeout 20m

      # SFTP resumes a single stream from an offset, which is a different
      # implementation of the same contract disk satisfies. Running it against a
      # real sshd is the only place the read-back fallback for a missing hash
      # state is exercised over a network.
      - name: Remote folder over SFTP
        env:
          PORTCLOAK_TEST_SSH_HOST: 127.0.0.1
          PORTCLOAK_TEST_SSH_PORT: "2222"
          PORTCLOAK_TEST_SSH_USER: portcloak
          PORTCLOAK_TEST_SSH_CREDENTIAL: portcloak-test-secret
          PORTCLOAK_TEST_SSH_FOLDER: /config
        run: go test -tags=integration ./internal/engine/store/... -run 'TestSFTP' -timeout 20m

      - name: SSH target
        env:
          PORTCLOAK_TEST_SSH_HOST: 127.0.0.1
          PORTCLOAK_TEST_SSH_PORT: "2222"
          PORTCLOAK_TEST_SSH_USER: portcloak
          PORTCLOAK_TEST_SSH_CREDENTIAL: portcloak-test-secret
        run: go test -tags=integration ./internal/engine/target/... -run 'TestSSH' -timeout 20m

      # The Docker rows are also the clone rows: every one of them creates an
      # ephemeral clone of the container named here, runs against it, and
      # destroys it. The runner's own Docker daemon is used directly rather than
      # as a service container, because the adapter talks to the socket.
      - name: Docker target via an ephemeral clone
        env:
          PORTCLOAK_TEST_DOCKER_CONTAINER: portcloak-serving
        run: |
          docker run -d --name portcloak-serving --label app=serving alpine:3 sleep infinity
          trap 'docker rm -f portcloak-serving >/dev/null 2>&1 || true' EXIT
          go test -tags=integration ./internal/engine/target/... -run 'TestDocker' -timeout 20m
          # Nothing PortCloak created may outlive the run.
          leftovers=$(docker ps -aq --filter "label=portcloak.io/ephemeral")
          if [ -n "$leftovers" ]; then
            echo "ephemeral clones survived the test run:" && docker ps -a --filter "label=portcloak.io/ephemeral"
            exit 1
          fi
