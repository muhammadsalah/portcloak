<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="PortCloak">
  <title>PortCloak</title>
  <!--
    macOS app icon geometry (Big Sur and later): the artwork plate is an
    824x824 squircle centred in a 1024x1024 canvas, leaving 100px of clear
    space the system uses for its own shadow and hover scaling. Drawing the
    plate full-bleed instead is the single most common reason a Mac icon looks
    oversized next to every other icon in the Dock.
  -->
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="#EEF1EF"/>
  <!--
    The mark verbatim from assets/logo/mark.svg on its 0 0 120 120 grid. Its
    drawn content spans x 24..96 and y 27..110 (the arc's stroke reaches 5
    above its 32 apex), so the content centre is (60, 68.5). Scaling by 5.9 and
    translating that centre onto the plate centre (512, 512) sets the mark at
    52% of the plate's width, which is the proportion Apple's own icons use.
  -->
  <g transform="translate(158 107.85) scale(5.9)">
    <path d="M36 56 A24 24 0 0 1 80.8 44" fill="none" stroke="#1FA896" stroke-width="10"/>
    <path d="M86.3 53.5 L73 48.5 L88.6 39.5 Z" fill="#1FA896"/>
    <rect x="24" y="56" width="72" height="54" rx="12" fill="#0E1A24"/>
    <circle cx="60" cy="76" r="8" fill="#EEF1EF"/>
    <rect x="56" y="80" width="8" height="18" rx="4" fill="#EEF1EF"/>
  </g>
</svg>
