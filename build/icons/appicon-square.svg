<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="PortCloak">
  <title>PortCloak</title>
  <!--
    Windows and Linux draw an icon into the whole box they are given, so this
    variant is full-bleed. The 230 radius is the same 22.4% proportion the
    macOS plate uses, which keeps the two reading as one icon rather than two.
  -->
  <rect width="1024" height="1024" rx="230" fill="#EEF1EF"/>
  <!-- Same mark, same grid; only the plate changed, so the content sits a
       little larger here because there is no system clear space to reserve. -->
  <g transform="translate(128 73.6) scale(6.4)">
    <path d="M36 56 A24 24 0 0 1 80.8 44" fill="none" stroke="#1FA896" stroke-width="10"/>
    <path d="M86.3 53.5 L73 48.5 L88.6 39.5 Z" fill="#1FA896"/>
    <rect x="24" y="56" width="72" height="54" rx="12" fill="#0E1A24"/>
    <circle cx="60" cy="76" r="8" fill="#EEF1EF"/>
    <rect x="56" y="80" width="8" height="18" rx="4" fill="#EEF1EF"/>
  </g>
</svg>
